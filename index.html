<!DOCTYPE html>
<html>

<head>
<title>Glass Hearts</title>

<style>

body{
margin:0;
background:black;
font-family:Arial;
color:white;
overflow-x:hidden;
}

/* HERO */

.hero{
height:100vh;
background-image:url("images/bg.png");
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

/* LOGO */

.logo{
width:900px;
max-width:80%;
transition:transform 0.2s linear;
}

/* SECCION DE ABAJO */

.bottom{
background:black;
display:flex;
justify-content:center;
align-items:flex-start;
padding-top:40px;
padding-bottom:120px;
}

/* BOTON DOWNLOAD */

.bottomdl{
width:420px;
max-width:80%;
cursor:pointer;
transition:transform 0.2s;
}

.bottomdl:hover{
transform:scale(1.05);
}

</style>

</head>

<body>

<div class="hero">

<img class="logo" id="logo" src="images/logo.png">

</div>

<div class="bottom">

<img class="bottomdl" src="images/BottomDl.png">

</div>

<script>

window.addEventListener("scroll", function(){

let scroll = window.scrollY;
let logo = document.getElementById("logo");

let scale = Math.max(0.55, 1 - scroll / 900);
let move = scroll * -0.25;

logo.style.transform =
"translateY("+move+"px) scale("+scale+")";

});

</script>

</body>

</html>
