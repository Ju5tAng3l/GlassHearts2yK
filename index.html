<!DOCTYPE html>
<html>

<head>
<title>Glass Hearts</title>

<style>

body{
margin:0;
background:black;
font-family:Arial, sans-serif;
color:white;
text-align:center;
}

/* fondo */

.hero{
position:relative;
height:100vh;
background-image:url("images/bg.png");
background-size:cover;
background-position:center;
overflow:hidden;
}

/* logo encima del fondo */

.logo{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
object-fit:contain;
animation:float 4s ease-in-out infinite;
pointer-events:none;


/* animacion del logo */

@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-20px);}
100%{transform:translateY(0);}
}

/* boton */

.download{
position:absolute;
bottom:60px;
left:50%;
transform:translateX(-50%);
padding:18px 45px;
font-size:22px;
background:#ff2a6d;
color:white;
text-decoration:none;
border-radius:10px;
transition:0.3s;
}

.download:hover{
background:#ff4f8b;
transform:translateX(-50%) scale(1.1);
}

/* seccion negra */

.sections{
background:black;
padding:80px20px;
}

.section-btn{
display:inline-block;
margin:20px;
padding:20px 40px;
font-size:20px;
background:#111;
border:2px solid #ff2a6d;
color:white;
text-decoration:none;
border-radius:10px;
transition:0.3s;
}

.section-btn:hover{
background:#ff2a6d;
transform:scale(1.05);
}

</style>
</head>

<body>

<div class="hero">

<img class="logo" src="images/logo.png">

<a class="download" href="download.html">Download</a>

</div>

<div class="sections">

<h2>Explore</h2>

<a class="section-btn" href="#">Charactrs</a>
<a class="section-btn" href="#">Lore</a>
<a class="section-btn" href="#">Rivals</a>

</div>

</body>

</html>
