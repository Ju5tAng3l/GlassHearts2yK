<!DOCTYPE html>
<html>

<head>
<title>Glass Hearts</title>

<style>

body{
margin:0;
background:#000;
font-family:Arial;
overflow-x:hidden;
}

.hero{
height:100vh;
background:url("images/bg.png") center/cover no-repeat;
display:flex;
justify-content:center;
align-items:center;
position:relative;
z-index:1;
}

.logo{
width:900px;
max-width:80%;
transition:transform 0.2s linear;
}

.download-area{
display:flex;
justify-content:center;
align-items:flex-start;
background:#000;
padding-top:60px;
padding-bottom:120px;
position:relative;
z-index:3;
}

.bottomdl{
display:block;
cursor:pointer;
transition:transform 0.2s;
}

.bottomdl:hover{
transform:scale(1.05);
}

</style>

</head>

<body>

<div class="hero">
<img class="logo" id="logo" src="images/logo.png">
</div>

<div class="download-area">
<a href="download.html">
<img class="bottomdl" src="images/BottomDl.png">
</a>
</div>

<script>

window.addEventListener("scroll", function(){

let scroll = window.scrollY;
let logo = document.getElementById("logo");

let scale = Math.max(0.55, 1 - scroll / 900);
let move = scroll * -0.25;

logo.style.transform =
"translateY("+move+"px) scale("+scale+")";

});

</script>

</body>

</html>
