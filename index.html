<!DOCTYPE html>
<html>

<head>
<title>Glass Hearts</title>

<style>

body{
margin:0;
background:black;
font-family:Arial;
color:white;
overflow-x:hidden;
}

.hero{
height:100vh;
background-image:url("images/bg.png");
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

.logo{
width:900px;
max-width:80%;
transition:transform 0.2s linear;
}

.bottom{
background:black;
display:flex;
justify-content:center;
align-items:center;
padding-top:80px;
padding-bottom:200px;
}

.bottomdl{
width:420px;
max-width:80%;
cursor:pointer;
transition:transform 0.2s;
}

.bottomdl:hover{
transform:scale(1.05);
}

.download-section{
background:black;
text-align:center;
padding:200px 20px;
}

.download-button{
display:inline-block;
padding:20px 50px;
background:#ff2a6d;
color:white;
text-decoration:none;
border-radius:10px;
font-size:22px;
}

</style>

</head>

<body>

<div class="hero">
<img class="logo" id="logo" src="images/logo.png">
</div>

<div class="bottom">
<a href="#download">
<img class="bottomdl" src="images/BottomDl.png">
</a>
</div>

<div id="download" class="download-section">

<h1>Download</h1>

<p>The mod is not available yet.</p>

<a class="download-button" href="#">
Download (Coming Soon)
</a>

</div>

<script>

window.addEventListener("scroll", function(){

let scroll = window.scrollY;
let logo = document.getElementById("logo");

let scale = Math.max(0.55, 1 - scroll / 900);
let move = scroll * -0.25;

logo.style.transform =
"translateY("+move+"px) scale("+scale+")";

});

</script>

</body>

</html>
