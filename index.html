<!DOCTYPE html>
<html>

<head>
<title>Glass Hearts</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:black;
color:white;
text-align:center;
}

/* HERO */

.hero{
height:100vh;
background-image:url("images/bg.png");
background-size:cover;
background-position:center;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

/* LOGO */

.logo{
width:70vw;
max-width:1200px;
height:auto;
animation:float 4s ease-in-out infinite;
}

/* ANIMACION */

@keyframesfloat{
0%{transform:translateY(0);}
50%{transform:translateY(-25px);}
100%{transform:translateY(0);}
}

/* BOTON DOWNLOAD */

.download{
margin-top:40px;
padding:18px 45px;
font-size:22px;
background:#ff2a6d;
color:white;
text-decoration:none;
border-radius:10px;
transition:0.3s;
}

.download:hover{
background:#ff4f8b;
transform:scale(1.08);
}

/* SECCION ABAJO */

.sections{
padding:80px 20px;
background:black;
}

.section-btn{
display:inline-block;
margin:20px;
padding:20px 40px;
font-size:20px;
backgound:#111;
border:2px solid #ff2a6d;
color:white;
text-decoration:none;
border-radius:10px;
transition:0.3s;
}

.section-btn:hover{
background:#ff2a6d;
transform:scale(1.05);
}

</style>
</head>

<body>

<div class="hero">

<img class="logo" src="images/logo.png">

<a class="download" href="download.html">Download</a>

</div>

<div class="sections">

<h2>Explore</h2>

<a class="section-btn" href="#">Characters</a>
<a class="section-btn" href="#">Lore</a>
<a class="section-btn" href="#">Rivals</a>

</div>
</body>

</html>
